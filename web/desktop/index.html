<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeArts 网关 · Windows</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230B57D0'/%3E%3Cpath d='M7 12h10M12 7v10' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../src/res/tokens.css">
<link rel="stylesheet" href="../src/res/base.css">
<link rel="stylesheet" href="../src/res/components.css">
<link rel="stylesheet" href="../src/desktop/layout.css">
</head>
<body data-page="home">

<div class="app">
  <aside class="rail">
    <a class="rail-logo" href="../index.html" title="返回入口">
      <span class="rail-mark">C</span>
      <span class="rail-logo-text">Gateway</span>
    </a>

    <nav class="rail-nav" id="railNav">
      <button class="rail-item is-active" data-nav="home">
        <span class="rail-icon"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg></span>
        <span class="rail-label">总览</span>
      </button>
      <button class="rail-item" data-nav="login">
        <span class="rail-icon"><svg viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 8l-4 4 4 4M6 12h10"/></svg></span>
        <span class="rail-label">登录</span>
      </button>
      <button class="rail-item" data-nav="models">
        <span class="rail-icon"><svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="M3 12l9 5 9-5M3 16l9 5 9-5"/></svg></span>
        <span class="rail-label">模型</span>
      </button>
      <button class="rail-item" data-nav="diag">
        <span class="rail-icon"><svg viewBox="0 0 24 24"><path d="M3 12h3l2.5-6 3.5 12 2.5-6H21"/></svg></span>
        <span class="rail-label">诊断</span>
      </button>
      <button class="rail-item" data-nav="keys">
        <span class="rail-icon"><svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="3.4"/><path d="M11 12h10M17 12v3M20 12v2"/></svg></span>
        <span class="rail-label">密钥</span>
      </button>
      <button class="rail-item" data-nav="artifacts">
        <span class="rail-icon"><svg viewBox="0 0 24 24"><path d="M3.5 8.5h5l1.6 2h10.4v8a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M3.5 8.5V6a1.5 1.5 0 0 1 1.5-1.5h4l1.6 2H19a1.5 1.5 0 0 1 1.5 1.5v2"/></svg></span>
        <span class="rail-label">产物</span>
      </button>
      <button class="rail-item" data-nav="settings">
        <span class="rail-icon"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></span>
        <span class="rail-label">设置</span>
      </button>
    </nav>

    <div class="rail-foot">
      <div class="rail-state">
        <span class="dot is-off" id="railDot2"></span>
        <span id="railState2">未运行</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-lead">
        <span class="product">CodeArts 网关</span>
        <span class="env-chip">Windows · v1.9.18</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" data-nav="models" aria-label="搜索模型">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        </button>
        <a class="icon-btn" href="../mobile/index.html" title="打开手机端">
          <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M10.5 18.5h3"/></svg>
        </a>
        <div class="avatar" title="本地演示">C</div>
      </div>
    </header>

    <div class="content" id="scrollRoot">
      <div class="page-head">
        <span class="crumb">CodeArts Gateway / <span id="pageCrumb">总览</span></span>
        <h1 id="pageTitle">总览</h1>
        <p id="pageLede">运行状态、接入地址与快捷操作，一屏掌握网关。</p>
      </div>
      <div id="view"></div>
      <footer class="page-foot">
        <span>CodeArts Gateway v1.9.18 · Windows</span>
        <span>与手机端共享 core / service / ui / res</span>
      </footer>
    </div>
  </main>

  <aside class="sheet">
    <div class="sheet-head">
      <span class="eyebrow">Source mapping</span>
      <h2 id="inspTitle">主界面</h2>
      <p>从 <code>app/src/main</code> 的布局与 Activity 还原。</p>
    </div>
    <div class="sheet-body" id="inspBody"></div>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-layer" id="modalLayer" hidden></div>

<script src="../src/core/data.js"></script>
<script src="../src/core/state.js"></script>
<script src="../src/core/storage.js"></script>
<script src="../src/res/icons.js"></script>
<script src="../src/service/gateway.js"></script>
<script src="../src/ui/components.js"></script>
<script src="../src/ui/pages.js"></script>
<script src="../src/ui/inspector.js"></script>
<script src="../src/ui/app.js"></script>
<script src="../src/desktop/app.js"></script>
</body>
</html>
